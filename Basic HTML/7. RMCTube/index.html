<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMCTube</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <h1>RMCTube</h1>
    <p>Minimal media experience</p>
  </header>

  <main class="container">

    <!-- VIDEO SECTION -->
    <section class="card">
      <h2>Featured Video</h2>

      <video controls width="640" class="media" poster="https://cdn.freecodecamp.org/curriculum/labs/past-event2.jpg">
        <source 
          src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" 
          type="video/mp4">
      </video>
    </section>

    <!-- AUDIO SECTION -->
    <section class="card">
      <h2>Now Playing</h2>

      <audio controls loop class="media">
        <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3" type="audio/mp3">
        <source src="https://cdn.freecodecamp.org/curriculum/js-music-player/we-are-going-to-make-it.mp3" type="audio/mp3">
      </audio>

    </section>
    
  </main>

</body>
</html>
